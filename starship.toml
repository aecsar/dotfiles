"$schema" = 'https://starship.rs/config-schema.json'

format = "$all$character"
right_format = "$status$git_metrics$package$time"

[gcloud]
disabled = true

[git_metrics]
disabled = false

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"

[status]
style = ''
symbol = ''
success_symbol = ''
format = '[\[$status\]]($style) '
map_symbol = true
disabled = false
